name=MTW TinyLoopScheduler
version=0.2.0
author=MyTechWaifu
maintainer=MyTechWaifu <MyTechWaifu@web3msg.fun>
sentence=A compact cooperative scheduler with static memory allocation for Arduino-compatible boards, with AVR and Generic backends.
paragraph=MTW TinyLoopScheduler provides periodic, delayed, posted, polling and step-based PARTED task execution without dynamic memory allocation. The AVR backend additionally provides optional IDLE sleep and ISR deferral. Scheduler subsystems and fixed-capacity queue profiles are selected at compile time for predictable SRAM and Flash usage.
category=Timing
url=https://github.com/MyTechWaifu/MTW_TinyLoopScheduler
architectures=*
includes=MTW_TinyLoopScheduler.h
